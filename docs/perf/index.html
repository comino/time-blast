<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Time Blast perf history</title>
<!-- Static dashboard for docs/perf/history.jsonl. No dependencies. Serve the repo (or docs/perf)
     with any static server, e.g. `python3 -m http.server -d docs/perf 8000`, and open /index.html. -->
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --page: #f3f3f1; --line: #e2e1dc; --grid: #ecebe7;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #77766f;
    --series-1: #2a78d6; --series-2: #eb6834; --band: rgba(42, 120, 214, .14); --warn: #b25b00;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface: #1a1a19; --page: #121211; --line: #34332f; --grid: #2a2926;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #96958c;
      --series-1: #3987e5; --series-2: #d95926; --band: rgba(57, 135, 229, .2); --warn: #f0a050;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --page: #121211; --line: #34332f; --grid: #2a2926;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #96958c;
    --series-1: #3987e5; --series-2: #d95926; --band: rgba(57, 135, 229, .2); --warn: #f0a050;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text-primary); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 2px; } h2 { font-size: 15px; margin: 26px 0 10px; }
  .sub { color: var(--text-secondary); margin: 0 0 14px; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 12px; }
  .filters label { color: var(--text-secondary); font-size: 12px; display: flex; gap: 6px; align-items: center; min-width: 0; max-width: 100%; }
  .filters label select { min-width: 0; max-width: calc(100vw - 110px); }
  select { font: inherit; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--text-primary); max-width: 100%; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); align-items: center; flex-wrap: wrap; }
  .key { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
  .key.p95 { border-top-style: dashed; }
  .key.band { height: 10px; border: 0; background: var(--band); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 6px; min-width: 0; }
  .card h3 { margin: 0; font-size: 13px; font-weight: 600; font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
  .card .now { color: var(--text-secondary); font-size: 12px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--text-muted); font-size: 10px; }
  .gridline { stroke: var(--grid); }
  .tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--text-primary); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.15); max-width: 320px; display: none; z-index: 5; }
  .tip b { font-weight: 600; } .tip .m { color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; background: var(--surface); }
  th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--text-secondary); font-size: 12px; font-weight: 600; }
  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  .meta { color: var(--text-secondary); font-size: 13px; }
  .warn { color: var(--warn); }
  .stagewrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
  #error { color: var(--warn); }
  @media (max-width: 480px) { .grid, .stagewrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Time Blast · performance history</h1>
  <p class="sub">One point per run of <code>pnpm perf</code> (harness, ●) or an ingested <code>/measure.html</code> report (hardware, ◆). Lower is better. Software timestamps: draw submission, not photons, unless a metric says frame.</p>
  <p id="error"></p>
  <div class="filters">
    <label>Metrics <select id="family"></select></label>
    <label>Host · GPU <select id="host"></select></label>
    <div class="legend"><span><i class="key" style="border-color:var(--series-1)"></i>median</span><span><i class="key band"></i>95 % band of the median</span><span><i class="key p95" style="border-color:var(--series-2)"></i>p95</span></div>
  </div>
  <div class="grid" id="charts"></div>
  <h2>Latest run</h2>
  <p class="meta" id="latest-meta"></p>
  <div class="stagewrap" id="stages"></div>
  <h2>Latest run, all metrics</h2>
  <div class="scroll"><table id="latest-table"></table></div>
</main>
<div class="tip" id="tip"></div>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = (v, unit) => v === undefined || v === null || !isFinite(v) ? '—' : `${Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2)} ${unit || ''}`.trim();
  let records;
  try {
    const text = await (await fetch('history.jsonl', { cache: 'no-store' })).text();
    records = text.split('\n').filter(l => l.trim()).map(l => JSON.parse(l)).filter(r => r.kind === 'time-blast.perf');
  } catch (e) {
    $('error').textContent = `Could not load history.jsonl (${e}). Open this page through a static server, not file://.`;
    return;
  }
  if (!records.length) { $('error').textContent = 'history.jsonl is empty.'; return; }
  records.forEach((r, i) => { r._i = i; r._group = `${r.source === 'hardware' ? 'hardware page' : 'harness'} · ${r.host.name} · ${r.gpu.backend}${r.gpu.adapter ? ` (${r.gpu.adapter})` : ''}`; });

  const groups = [...new Set(records.map(r => r._group))];
  $('host').innerHTML = `<option value="">all</option>` + groups.map(g => `<option>${esc(g)}</option>`).join('');
  const families = [...new Set(records.flatMap(r => Object.keys(r.metrics).map(k => k.split('.')[0])))].sort();
  $('family').innerHTML = families.map(f => `<option${f === 'e2e' ? ' selected' : ''}>${f}</option>`).join('') + '<option value="">all</option>';

  const tip = $('tip');
  const showTip = (ev, html) => { tip.innerHTML = html; tip.style.display = 'block';
    const x = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(ev.clientY + 14, innerHeight - tip.offsetHeight - 8);
    tip.style.left = `${x}px`; tip.style.top = `${y}px`; };
  const hideTip = () => { tip.style.display = 'none'; };

  function chart(metric, rows) {
    const W = 360, H = 170, L = 44, R = 8, T = 10, B = 26;
    const unit = rows[0].metrics[metric].unit;
    const ys = rows.flatMap(r => { const m = r.metrics[metric]; return [m.median, m.p95, m.ciLow, m.ciHigh]; }).filter(isFinite);
    let lo = Math.min(0, ...ys), hi = Math.max(...ys) * 1.08 || 1;
    const x = i => rows.length === 1 ? L + (W - L - R) / 2 : L + (i / (rows.length - 1)) * (W - L - R);
    const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const ticks = Array.from({ length: 4 }, (_, k) => lo + (hi - lo) * k / 3);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(metric)} over runs">`;
    for (const t of ticks) s += `<line class="gridline" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 4}" y="${y(t) + 3}" text-anchor="end">${fmt(t)}</text>`;
    // Band: median confidence interval.
    if (rows.length > 1) {
      const top = rows.map((r, i) => `${x(i)},${y(r.metrics[metric].ciHigh)}`), bottom = rows.map((r, i) => `${x(i)},${y(r.metrics[metric].ciLow)}`).reverse();
      s += `<polygon points="${top.concat(bottom).join(' ')}" fill="var(--band)"/>`;
      s += `<polyline points="${rows.map((r, i) => `${x(i)},${y(r.metrics[metric].p95)}`).join(' ')}" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-dasharray="4 3"/>`;
      s += `<polyline points="${rows.map((r, i) => `${x(i)},${y(r.metrics[metric].median)}`).join(' ')}" fill="none" stroke="var(--series-1)" stroke-width="2"/>`;
    } else {
      const m = rows[0].metrics[metric];
      s += `<line x1="${x(0)}" x2="${x(0)}" y1="${y(m.ciLow)}" y2="${y(m.ciHigh)}" stroke="var(--band)" stroke-width="10"/>`;
    }
    const step = Math.max(1, Math.ceil(rows.length / 6));
    rows.forEach((r, i) => {
      const m = r.metrics[metric], cx = x(i), cy = y(m.median);
      s += r.source === 'hardware'
        ? `<path d="M${cx} ${cy - 5}L${cx + 5} ${cy}L${cx} ${cy + 5}L${cx - 5} ${cy}Z" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/>`
        : `<circle cx="${cx}" cy="${cy}" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/>`;
      s += `<circle cx="${cx}" cy="${y(m.p95)}" r="3" fill="var(--series-2)" stroke="var(--surface)" stroke-width="1.5"/>`;
      if (i % step === 0 || i === rows.length - 1) {
        // Same commit as the previous point: label by time instead.
        const label = i > 0 && rows[i - 1].commit === r.commit ? r.date.slice(11, 16) : `${r.commit.slice(0, 7)}${r.dirty ? '*' : ''}`;
        const anchor = rows.length === 1 ? 'middle' : i === 0 ? 'start' : i === rows.length - 1 ? 'end' : 'middle';
        s += `<text x="${cx}" y="${H - 8}" text-anchor="${anchor}">${esc(label)}</text>`;
      }
      // Hit target wider than the mark.
      const w = rows.length > 1 ? (W - L - R) / (rows.length - 1) : 40;
      s += `<rect data-i="${r._i}" x="${cx - w / 2}" y="${T}" width="${w}" height="${H - T - B}" fill="transparent"/>`;
    });
    s += '</svg>';
    const last = rows[rows.length - 1].metrics[metric];
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h3>${esc(metric)}</h3><div class="now">latest median ${fmt(last.median, unit)} · p95 ${fmt(last.p95, unit)} · n ${last.n}</div>${s}`;
    card.querySelectorAll('rect[data-i]').forEach(el => {
      el.addEventListener('mousemove', ev => {
        const r = records[Number(el.dataset.i)], m = r.metrics[metric];
        showTip(ev, `<b>${esc(r.commit)}${r.dirty ? ' (dirty)' : ''}</b> <span class="m">${esc(r.date.slice(0, 16).replace('T', ' '))}</span><br>
          median <b>${fmt(m.median, unit)}</b> <span class="m">(band ${fmt(m.ciLow)}–${fmt(m.ciHigh, unit)})</span><br>p95 ${fmt(m.p95, unit)} · min ${fmt(m.min, unit)} · max ${fmt(m.max, unit)} · n ${m.n}<br>
          <span class="m">${esc(r._group)}<br>load ${r.host.loadBefore ? r.host.loadBefore.join('/') : '?'} → ${r.host.loadAfter ? r.host.loadAfter.join('/') : '?'}${r.browser ? ` · ${esc(r.browser.name)} ${esc(r.browser.version)}` : ''}</span>`);
      });
      el.addEventListener('mouseleave', hideTip);
    });
    return card;
  }

  function draw() {
    const family = $('family').value, group = $('host').value;
    const charts = $('charts');
    charts.innerHTML = '';
    const pool = records.filter(r => !group || r._group === group);
    const metrics = [...new Set(pool.flatMap(r => Object.keys(r.metrics)))].filter(k => !family || k.split('.')[0] === family).sort();
    for (const metric of metrics) {
      // One line per host+GPU group: a chart mixes groups only when "all" is chosen, and then
      // each group is plotted as its own chart so runs from different machines never join a line.
      const byGroup = new Map();
      for (const r of pool) if (r.metrics[metric]) { if (!byGroup.has(r._group)) byGroup.set(r._group, []); byGroup.get(r._group).push(r); }
      for (const [g, rows] of byGroup) {
        const card = chart(metric, rows);
        if (byGroup.size > 1 || !group) card.querySelector('.now').insertAdjacentHTML('beforeend', `<br><span>${esc(g)}</span>`);
        charts.append(card);
      }
    }
    if (!metrics.length) charts.innerHTML = '<p class="meta">No metrics for this filter.</p>';
  }
  $('family').addEventListener('change', draw);
  $('host').addEventListener('change', draw);
  draw();

  // Latest run: stage breakdowns (horizontal bars of per-stage median deltas).
  const latest = records[records.length - 1];
  $('latest-meta').innerHTML = `${esc(latest.source)} · ${esc(latest.suite)} · <b>${esc(latest.commit)}</b>${latest.dirty ? ' <span class="warn">(dirty)</span>' : ''} · ${esc(latest.date)} · ${esc(latest.host.name)} (${esc(latest.host.cpu)}, ${latest.host.cores} cores) · load ${latest.host.loadBefore ? latest.host.loadBefore.join('/') : '?'} → ${latest.host.loadAfter ? latest.host.loadAfter.join('/') : '?'} · ${latest.browser ? esc(`${latest.browser.name} ${latest.browser.version}`) : ''} · GPU <b>${esc(latest.gpu.backend)}</b>${latest.gpu.adapter ? ` (${esc(latest.gpu.adapter)})` : ''}${(latest.notes || []).length ? `<br>${latest.notes.map(esc).join('<br>')}` : ''}`;
  const stages = $('stages');
  for (const [metric, rows] of Object.entries(latest.stages || {})) {
    if (!rows.length) continue;
    const W = 380, rowH = 18, L = 150, R = 60, H = rows.length * rowH + 8;
    const max = Math.max(...rows.map(r => Math.abs(r.median)), 0.001);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="stage breakdown of ${esc(metric)}">`;
    rows.forEach((r, i) => {
      const y = 4 + i * rowH, w = Math.max(0, r.median) / max * (W - L - R);
      s += `<text x="${L - 6}" y="${y + 12}" text-anchor="end">${esc(r.label)}</text>`;
      if (w > 0) s += `<rect x="${L}" y="${y + 3}" width="${Math.max(w, 1)}" height="${rowH - 6}" rx="3" fill="var(--series-1)"><title>${esc(r.label)}: median ${fmt(r.median, 'ms')}, p95 ${fmt(r.p95, 'ms')}, n ${r.n}</title></rect>`;
      s += `<text x="${L + w + 4}" y="${y + 12}">${fmt(r.median, 'ms')}</text>`;
    });
    s += '</svg>';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h3>${esc(metric)}</h3><div class="now">median delta from the previous stage (negative: stamped before it)</div>${s}`;
    stages.append(card);
  }
  const rows = Object.entries(latest.metrics).sort(([a], [b]) => a.localeCompare(b));
  $('latest-table').innerHTML = `<thead><tr><th>metric</th><th>n</th><th>median</th><th>95 % band</th><th>p95</th><th>min</th><th>max</th></tr></thead><tbody>${rows.map(([k, m]) =>
    `<tr><td>${esc(k)}</td><td>${m.n}</td><td>${fmt(m.median, m.unit)}</td><td>${fmt(m.ciLow)}–${fmt(m.ciHigh, m.unit)}</td><td>${fmt(m.p95, m.unit)}</td><td>${fmt(m.min, m.unit)}</td><td>${fmt(m.max, m.unit)}</td></tr>`).join('')}</tbody>`;
})();
</script>
</body>
</html>
