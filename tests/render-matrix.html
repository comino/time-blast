<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tb-render matrix views</title>
  <style>
    :root { color-scheme: dark; --bg: #08111b; --panel: #10212d; --line: #29414d; --text: #d6e9e8; --muted: #7695a2; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 13px/1.4 ui-monospace, SFMono-Regular, monospace; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; }
    figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; position: relative; }
    figcaption { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .plot { position: relative; width: 100%; height: 260px; }
    .plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .labels span { position: absolute; font-size: 10px; color: var(--muted); white-space: nowrap; pointer-events: none; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 10px; color: var(--muted); margin-top: 4px; }
    .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 3px; vertical-align: middle; }
    pre { background: var(--panel); border: 1px solid var(--line); padding: 8px; overflow: auto; max-height: 50vh; }
  </style>
</head>
<body>
  <p>Heatmap and surface on the Rust/Wasm renderer. <code>?mode=views&amp;backend=webgpu|webgl2</code> renders each case for
    <code>tests/render_matrix.py</code>; <code>?mode=bench</code> times first draw and per-batch appends. SwiftShader timings are
    software-GPU timings, not hardware.</p>
  <div id="grid"></div>
  <pre id="out">running…</pre>
  <script type="module" src="./render-matrix-page.ts"></script>
</body>
</html>
