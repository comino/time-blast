# Standalone: own lockfile and release profile; deployed as a native binary.
[workspace]

[package]
name = "time-blast-inference"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.88"

[dependencies]
tb-protocol = { path = "../tb-protocol" }
axum = { version = "=0.8.8", features = ["http1", "http2", "json", "tokio"] }
fastwebsockets = { version = "=0.10.0", features = ["upgrade", "unstable-split"] }
futures-util = "0.3.31"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
serde = { version = "1.0.228", features = ["derive"] }
# float_roundtrip: parse JSON numbers exactly like JavaScript, so prompt.rs and prompt.ts render
# the same digits (the default fast path is off by an ulp on e.g. -99.68190002440001).
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
tokio-util = "=0.7.19"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
